name: Deploy

on:
  push:
    branches: [main]
  # Manual "Run workflow" button.
  workflow_dispatch:
  # Fired by the StratumDocs repo when its docs change, so the site rebuilds and
  # picks up the latest Markdown. See the sender workflow in StratumDocs.
  repository_dispatch:
    types: [docs-updated]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm install

      - run: npm run build

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
